# Настройки конвейера. Меняй и коммить — следующий запуск подхватит.

# Публиковать ролики (true) или только собирать их для проверки (false)
publish: true

# Запускаться по кругу без остановки (каждый запуск в конце стартует следующий).
# false останавливает конвейер после текущего запуска.
autorun: true

# Игра, клипы которой берём (точное название в Twitch).
# До релиза для теста можно поставить "Grand Theft Auto V".
game: "Grand Theft Auto VI"

# За сколько часов назад искать клипы
lookback_hours: 24
# Минимум просмотров клипа на Twitch, чтобы он считался «ярким моментом»
min_views: 300
# Длительность клипа (секунды)
min_duration: 8
max_duration: 60

# Максимум роликов в сутки на профиль и минимальный перерыв между ними (минуты).
# В каждый слот выходит самый сильный из одобренных моментов.
# Считаются любые 24 часа подряд, как у YouTube: 19.11 он отказал новому каналу в 11-й загрузке за сутки
# и продолжал отказывать после полуночи по тихоокеанскому времени, пока старые ролики не стали старше суток.
# Поэтому было не больше 9 за 24 часа и шаг 160 минут.
# После подтверждения канала по телефону лимит выше: тогда можно вернуть 12 и 120.
#
# 21.11: темп снижен до трёх роликов в сутки в заданные часы (post_times_utc). TikTok дал 150-970 просмотров
# шести роликам 19-20.11, а с седьмого ролика за сутки перестал показывать новые (0-4 просмотра у одиннадцати
# подряд); YouTube за три дня дал 44 просмотра на 24 ролика.
# Чтобы вернуть прежний темп: убрать post_times_utc и поставить max_posts_per_day: 9.
max_posts_per_day: 4      # страховка: при трёх выходах в сутки сюда не доходит
min_gap_minutes: 160
# Часы выхода по UTC, обязательно в кавычках. 08:30, 13:00 и 18:00 это 10:30, 15:00 и 20:00 по Риге.
# Утренний выход стоит после 08:10 UTC: до этого YouTube три утра подряд отказывал в загрузке.
# Слот открыт slot_window_minutes минут; если за это время выложить нечего или некуда, он пропускается.
post_times_utc: ["08:30", "13:00", "18:00"]
slot_window_minutes: 150

# Бесплатные фильтры до редактора: отсекают ролики без движения в кадре
# (студия, меню, загрузка) и без вебки стримера.
quality:
  require_cam: true
  min_motion: 0.04
  max_static_share: 0.6

# Редактор: смотрит кадры и расшифровку речи каждого кандидата, ставит оценку 1-10,
# обрезает пустое начало и конец, пишет подпись. Публикуется только min_score и выше.
#   mode: review — Claude в проекте GTA проверяет ветку review по расписанию (ключ не нужен)
#   mode: api    — через Claude API, нужен секрет ANTHROPIC_API_KEY (модель и effort ниже)
judge:
  enabled: true
  mode: review
  min_score: 6
  block_gambling_ads: true
  max_checked_per_run: 8
  # не набирать новых кандидатов, пока в очереди (у редактора и одобренных) уже столько
  queue_target: 10
  required: true
  model: claude-opus-5-5
  effort: low
  frames: 10

# Профили upload-post. Каждый профиль — своя пара TikTok + YouTube.
# Сейчас всё идёт в один профиль; чтобы разделить RU и EN — создай второй
# профиль в upload-post и впиши его имя в profile у нужной группы.
groups:
  en:
    profile: "gta6"
    publish: false      # 20.11: пока выкладываем только русских; английские моменты отбираются и копятся для отдельного канала
    language: en
    hashtags: "#gta6 #gta #gtavi #twitch #streamer #gaming"
    streamers: [xqc, kaicenat, jynxzi, summit1g, buddha, lord_kebun, dasmehdi, penta]
  ru:
    profile: "gta6"
    language: ru
    hashtags: "#gta6 #гта6 #гта #стрим #твич #gaming"
    streamers: [buster, evelone2004, bratishkinoff, deepins02, zubarefff, koreshzy, t2x2, mazellovvv, strogo, recrent]

platforms: [tiktok, youtube]  # TikTok снова включён 19.11: пробный ролик набрал 319 просмотров за 2 часа

# Ручная разметка вебки, если автоопределение ошибается.
# Доли кадра: x, y, ширина, высота (0..1). Пример:
# cam_overrides:
#   xqc: [0.0, 0.62, 0.22, 0.38]
cam_overrides:
  honeymad: [0.012, 0.51, 0.211, 0.208]
  t2x2: [0.757, 0.646, 0.18, 0.225]      # без баннера букмекера на заднем плане
  buster: [0.0, 0.0, 0.256, 0.253]       # в кадре двое, берём всё окно камеры
  theburntpeanut: [0.15, 0.70, 0.22, 0.30]  # вместо вебки аватар-арахис внизу слева
  summit1g: [0.0, 0.486, 0.266, 0.264]   # детектор лица находит вебку через раз

# Обложка: самый сильный кадр клипа и крупный заголовок от редактора. С заголовком она ещё и встаёт
# первой половиной секунды ролика (её берёт TikTok и видит зритель в ленте) и уходит в YouTube как обложка.
covers:
  enabled: true
  youtube_thumbnail: true

# Субтитры (faster-whisper). Модель: tiny/base/small. small точнее, но медленнее.
subtitles: true
whisper_model: small

# Поиск моментов по всплескам чата (живые стримы в целевой игре).
# Каждый запуск слушает чаты listen_minutes минут. Всплеск: за 15 секунд пишет
# в ratio раз больше зрителей, чем обычно (для огромных чатов достаточно 1.6 раза
# при отклонении z), и не меньше min_msgs человек.
# Вырезается кусок эфира: before секунд до всплеска и after после.
chat:
  enabled: true
  # плюс top_live самых крупных живых стримов игры на каждом языке (RU и EN отдельно),
  # даже если их нет в списках выше; мельче top_live_min_viewers зрителей не берём
  top_live: 6
  top_live_min_viewers: 3000
  listen_minutes: 20
  ratio: 2.5
  min_msgs: 35   # 20 пропускало шум маленьких чатов (22 человека поздоровались = «всплеск»)
  z: 6.0
  before: 42
  after: 14
