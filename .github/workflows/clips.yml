name: clips

# One run: listen to live chats, check candidates, publish the best approved moment.
# With chain=true each run starts the next one, so the pipeline works as a loop;
# watchdog.yml restarts the loop if it ever stops.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything except posting"
        type: boolean
        default: true
      chain:
        description: "Start the next run when this one ends (the normal loop)"
        type: boolean
        default: false
      game:
        description: "Game override for tests, e.g. Grand Theft Auto V (empty = from config)"
        type: string
        default: ""
      listen_minutes:
        description: "Test: minutes to listen to chats (empty = from config)"
        type: string
        default: ""
      test_url:
        description: "Test: one Twitch clip URL through the checks and the layout (nothing is posted)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache ffmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-v1
      - name: Install ffmpeg (static build)
        timeout-minutes: 4
        run: |
          if [ ! -x ~/ffmpeg/bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg && curl -sSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C ~/ffmpeg --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          ~/ffmpeg/bin/ffmpeg -version | head -1
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Cache cover font
        uses: actions/cache@v4
        with:
          path: ~/fonts
          key: cover-font-v1
      - name: Cover font (open licence, falls back to DejaVu when the download fails)
        run: |
          mkdir -p ~/fonts
          if [ ! -s ~/fonts/cover.ttf ]; then
            for u in \
              https://github.com/google/fonts/raw/main/ofl/firasansextracondensed/FiraSansExtraCondensed-Black.ttf \
              https://github.com/google/fonts/raw/main/ofl/russoone/RussoOne-Regular.ttf; do
              if curl -fsSL --retry 2 -o ~/fonts/cover.ttf "$u"; then break; else rm -f ~/fonts/cover.ttf; fi
            done
          fi
          ls -la ~/fonts || true
      - run: pip install -q -r requirements.txt
      - name: Run clipper
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          UPLOAD_POST_KEY: ${{ secrets.UPLOAD_POST_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHAT_LISTEN_MINUTES: ${{ inputs.listen_minutes }}
          DRY: ${{ inputs.dry_run }}
          GAME: ${{ inputs.game }}
          TEST_URL: ${{ inputs.test_url }}
        run: |
          if [ -n "$TEST_URL" ]; then
            python clipper.py --url "$TEST_URL" --streamer "$(echo "$TEST_URL" | cut -d/ -f4)"
          elif [ "$DRY" = "true" ]; then
            python clipper.py --dry-run ${GAME:+--game "$GAME"}
          else
            python clipper.py
          fi
      - name: Keep rendered videos for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore
      - name: Push review material (branches review and previews)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/push_branches.py
      - name: Save state
        if: always()
        run: |
          git config user.name "clips-bot"
          git config user.email "clips-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -qm "state: update"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Start the next run
        if: ${{ !cancelled() && inputs.chain && inputs.test_url == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q --rebase || true
          if grep -Eq '^autorun:\s*false' config.yaml; then echo "autorun is off, the loop stops here"; exit 0; fi
          [ -f out/.listened ] || sleep 600    # nobody was live: wait before looking again
          gh workflow run clips.yml --ref main -f dry_run=false -f chain=true
