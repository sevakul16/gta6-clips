name: clips

on:
  schedule:
    - cron: "7,37 * * * *"      # every 30 min (off the :00 rush)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only render, do not post"
        type: boolean
        default: true
      game:
        description: "Game override for tests, e.g. Grand Theft Auto V (empty = from config)"
        type: string
        default: ""
      listen_minutes:
        description: "Test: minutes to listen to chats (empty = from config)"
        type: string
        default: ""
      private_post:
        description: "Test: also post the first test_url clip PRIVATELY"
        type: boolean
        default: false
      test_url:
        description: "Test: Twitch clips page or clip URL to render (no keys needed), e.g. https://www.twitch.tv/xqc/clips?range=7d"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache ffmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-v1
      - name: Install ffmpeg (static build)
        timeout-minutes: 4
        run: |
          if [ ! -x ~/ffmpeg/bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg && curl -sSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C ~/ffmpeg --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          ~/ffmpeg/bin/ffmpeg -version | head -1
          fc-list | grep -i dejavu | head -1 || echo "no dejavu font"
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - run: pip install -r requirements.txt
      - name: Run clipper
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          UPLOAD_POST_KEY: ${{ secrets.UPLOAD_POST_KEY }}
          CHAT_LISTEN_MINUTES: ${{ inputs.listen_minutes }}
        run: |
          if [ -n "${{ inputs.test_url }}" ]; then
            EXTRA=""; [ "${{ inputs.private_post }}" = "true" ] && EXTRA="--private-post"
            python clipper.py --url "${{ inputs.test_url }}" --streamer "$(echo '${{ inputs.test_url }}' | cut -d/ -f4)" $EXTRA
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            if [ -n "${{ inputs.game }}" ]; then python clipper.py --dry-run --game "${{ inputs.game }}"; else python clipper.py --dry-run; fi
          else
            python clipper.py
          fi
      - name: Keep rendered videos for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish preview frames (test runs)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/prev && for f in out/*.mp4; do [ -e "$f" ] || continue; b=$(basename "$f" .mp4)
            for t in 2 6 10; do ffmpeg -v error -y -ss $t -i "$f" -frames:v 1 -vf scale=540:-2 "/tmp/prev/${b}_${t}s.jpg" || true; done; done
          ls /tmp/prev | head -1 > /dev/null || exit 0
          git config user.name "clips-bot"; git config user.email "clips-bot@users.noreply.github.com"
          git switch --orphan previews && git rm -rfq --ignore-unmatch . && cp /tmp/prev/* . && git add -A && git commit -qm "previews ${{ github.run_id }}" && git push -f origin previews
          git switch -q main
      - name: Save state
        if: always()
        run: |
          git config user.name "clips-bot"
          git config user.email "clips-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "state: update posted clips" && git push)
