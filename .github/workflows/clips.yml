name: clips

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 min
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only render, do not post"
        type: boolean
        default: true
      game:
        description: "Game override for tests, e.g. Grand Theft Auto V (empty = from config)"
        type: string
        default: ""
      test_url:
        description: "Test: Twitch clips page or clip URL to render (no keys needed), e.g. https://www.twitch.tv/xqc/clips?range=7d"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core > /dev/null
          ffmpeg -version | head -1
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - run: pip install -r requirements.txt
      - name: Run clipper
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          UPLOAD_POST_KEY: ${{ secrets.UPLOAD_POST_KEY }}
        run: |
          if [ -n "${{ inputs.test_url }}" ]; then
            python clipper.py --url "${{ inputs.test_url }}" --streamer "$(echo '${{ inputs.test_url }}' | cut -d/ -f4)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            if [ -n "${{ inputs.game }}" ]; then python clipper.py --dry-run --game "${{ inputs.game }}"; else python clipper.py --dry-run; fi
          else
            python clipper.py
          fi
      - name: Keep rendered videos for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish preview frames (test runs)
        if: always() && inputs.test_url != ''
        run: |
          mkdir -p /tmp/prev && for f in out/*.mp4; do [ -e "$f" ] || continue; b=$(basename "$f" .mp4)
            for t in 2 6 10; do ffmpeg -v error -y -ss $t -i "$f" -frames:v 1 -vf scale=540:-2 "/tmp/prev/${b}_${t}s.jpg" || true; done; done
          ls /tmp/prev | head -1 > /dev/null || exit 0
          git config user.name "clips-bot"; git config user.email "clips-bot@users.noreply.github.com"
          git switch --orphan previews && git rm -rfq . && cp /tmp/prev/* . && git add -A && git commit -qm "previews ${{ github.run_id }}" && git push -f origin previews
          git switch -q main
      - name: Save state
        if: always()
        run: |
          git config user.name "clips-bot"
          git config user.email "clips-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "state: update posted clips" && git push)
