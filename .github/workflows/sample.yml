name: sample

# One Twitch clip through the layout with its cover; nothing is posted.
# The cover, the contact sheet and the report go to the `samples` branch, the video to the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Twitch clip URL"
        type: string
        required: true
      hook:
        description: "Cover headline (2-4 words)"
        type: string
        default: ""
      cover_at:
        description: "Second of the clip for the cover frame (empty = the frame with the most motion)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: sample
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache ffmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-v1
      - name: Install ffmpeg (static build)
        timeout-minutes: 4
        run: |
          if [ ! -x ~/ffmpeg/bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg && curl -sSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C ~/ffmpeg --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          ~/ffmpeg/bin/ffmpeg -version | head -1
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Cache cover font
        uses: actions/cache@v4
        with:
          path: ~/fonts
          key: cover-font-v1
      - name: Cover font (open licence, falls back to DejaVu when the download fails)
        run: |
          mkdir -p ~/fonts
          if [ ! -s ~/fonts/cover.ttf ]; then
            for u in \
              https://github.com/google/fonts/raw/main/ofl/firasansextracondensed/FiraSansExtraCondensed-Black.ttf \
              https://github.com/google/fonts/raw/main/ofl/russoone/RussoOne-Regular.ttf; do
              if curl -fsSL --retry 2 -o ~/fonts/cover.ttf "$u"; then break; else rm -f ~/fonts/cover.ttf; fi
            done
          fi
          ls -la ~/fonts || true
      - run: pip install -q -r requirements.txt
      - name: Render the sample
        env:
          URL: ${{ inputs.url }}
          HOOK: ${{ inputs.hook }}
          COVER_AT: ${{ inputs.cover_at }}
        run: |
          python clipper.py --url "$URL" --streamer "$(echo "$URL" | cut -d/ -f4)" \
            ${HOOK:+--hook "$HOOK"} ${COVER_AT:+--cover-at "$COVER_AT"}
      - name: Keep the rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore
      - name: Push the cover and the sheet to the samples branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/samples
          cp out/previews/* out/samples/ 2>/dev/null || true
          cp out/*_cover.jpg out/samples/ 2>/dev/null || true
          if [ -n "$(ls -A out/samples)" ]; then
            python -c "import sys; sys.path.insert(0, 'tools'); import push_branches as p; p.push('out/samples', 'samples')"
          fi
