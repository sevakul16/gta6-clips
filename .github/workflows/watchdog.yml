name: watchdog

# Restarts the clips loop if it is not running. `autorun: false` in config.yaml stops it for good.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/contents/config.yaml" -H "Accept: application/vnd.github.raw" | grep -Eq '^autorun:\s*false'; then
            echo "autorun is off"; exit 0
          fi
          n=$(gh run list --workflow clips.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$n" = "0" ]; then
            gh workflow run clips.yml --ref main -f dry_run=false -f chain=true
            echo "loop restarted"
          else
            echo "loop is alive ($n active)"
          fi
